h.append(el("span","bd "+(r.completed?"y":"n"),r.completed?"YES ✔":"NO ✖"),el("span","meta",(last?"Last answer · ":"")+(r.date||"")+" "+(r.time||"")));
const ul=el("ul");PR.forEach((t,i)=>{const y=r.promises&&r.promises["p"+(i+1)];ul.append(el("li",y?"ok":"no",(y?"✔ ":"✖ ")+t))});
c.append(h,el("p","meta",(r.name||"-")+" · "+(r.acceptedCount??0)+"/6 promise accepted"),ul);
if(r.optionalMessage)c.append(el("p","msg","“"+r.optionalMessage+"”"));return c}
function render(){const s=[...rows].sort((a,b)=>b.submittedAt-a.submittedAt),y=s.filter(r=>r.completed).length;
$("sT").textContent=s.length;$("sC").textContent=y;$("sN").textContent=s.length-y;
const A=$("aLast"),L=$("aList");A.textContent="";L.textContent="";
if(!s.length){A.append(el("p","sub","Ekhono kono answer ashe ni."));return}
A.append(card(s[0],true));s.slice(1).forEach(r=>L.append(card(r,false)))}
$("aRef").onclick=async()=>{try{rows=toList(await get(subs));$("aErr").textContent="";render()}catch(e){$("aErr").textContent="Refresh hoy ni: "+(e.code||e.message)}};
const openAdmin=()=>{panel=true;$("admin").classList.add("open");startData()};
const closeAdmin=()=>{panel=false;$("admin").classList.remove("open");if(unsub){unsub();unsub=null}};
$("aClose").onclick=closeAdmin;
let lastA=0;
addEventListener("keydown",e=>{if(e.key==="Escape"){closeAdmin();return}
const t=e.target;if(t&&(/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)||t.isContentEditable)||e.repeat||e.ctrlKey||e.metaKey||e.altKey||e.key.toLowerCase()!=="a")return;
const n=Date.now();if(n-lastA<450){lastA=0;if(!panel)openAdmin()}else lastA=n});
</script>
